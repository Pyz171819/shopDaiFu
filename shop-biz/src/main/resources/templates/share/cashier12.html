<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <title th:text="${pageTitle}">滴滴打车代付</title>
    <meta name="description" th:content="${shareDesc}">

    <meta property="og:title" th:content="${shareTitle}">
    <meta property="og:description" th:content="${shareDesc}">
    <meta property="og:image" th:content="${shareImage}">
    <meta property="og:url" th:content="${shareUrl}">
    <meta property="og:type" content="website">

    <link rel="canonical" th:href="${shareUrl}">

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            background: #f3f4f6;
            color: #333;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        }
        .cashier-didi {
            min-height: 100vh;
            padding-bottom: 24px;
            background: #f3f4f6;
        }
        .status-bar {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            padding: 15px 20px;
            background: #fff;
            color: #000;
            font-size: 20px;
            font-weight: 700;
        }
        .back-mark {
            margin-right: 10px;
            font-size: 28px;
            line-height: 1;
        }
        .white-card {
            position: relative;
            margin: 0 12px 12px;
            padding: 15px;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 1px 3px rgba(0,0,0,.02);
        }
        .route-card-full {
            overflow: hidden;
            padding: 0;
        }
        .route-image-wrapper {
            position: relative;
            width: 100%;
        }
        .route-map {
            position: relative;
            height: 150px;
            background:
                linear-gradient(135deg, rgba(255,128,0,.12), transparent 40%),
                linear-gradient(45deg, transparent 48%, rgba(39,74,140,.08) 49%, rgba(39,74,140,.08) 51%, transparent 52%),
                #f8fafc;
        }
        .route-line {
            position: absolute;
            left: 16px;
            top: 42px;
            bottom: 42px;
            width: 2px;
            background: #d4d7dc;
        }
        .route-node {
            position: absolute;
            left: 12px;
            z-index: 2;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ccc;
        }
        .node-start {
            top: 38px;
        }
        .node-end {
            bottom: 38px;
            background: #ff8000;
        }
        .addr-text {
            position: absolute;
            left: 32px;
            width: 80%;
            overflow: hidden;
            font-size: 13px;
            font-weight: 500;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .addr-start {
            top: 34px;
            color: #333;
        }
        .addr-end {
            bottom: 34px;
            color: #ff8000;
            font-weight: 600;
        }
        .driver-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .prod-name {
            margin-bottom: 5px;
            color: #000;
            font-size: 18px;
            font-weight: 700;
        }
        .driver-info {
            display: flex;
            align-items: center;
            color: #999;
            font-size: 12px;
        }
        .star-score {
            margin: 0 5px;
            color: #ff8000;
            font-weight: 700;
        }
        .driver-avatar-group {
            position: relative;
            display: flex;
            justify-content: flex-end;
            width: 120px;
            height: 50px;
        }
        .car-shape {
            position: absolute;
            top: 20px;
            right: 38px;
            width: 62px;
            height: 22px;
            border-radius: 18px 26px 10px 10px;
            background: #274a8c;
        }
        .car-shape::before,
        .car-shape::after {
            content: "";
            position: absolute;
            bottom: -4px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #111;
        }
        .car-shape::before { left: 10px; }
        .car-shape::after { right: 10px; }
        .car-avatar {
            position: relative;
            z-index: 2;
            width: 50px;
            height: 50px;
            border: 2px solid #fff;
            border-radius: 50%;
            background: #fff;
            box-shadow: -2px 2px 5px rgba(0,0,0,.1);
            object-fit: cover;
        }
        .divider {
            margin: 10px 0;
            border-top: 1px solid #f4f4f4;
        }
        .action-row {
            display: flex;
            justify-content: space-around;
            padding-top: 10px;
            text-align: center;
        }
        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #666;
            font-size: 11px;
        }
        .action-icon-circle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            margin-bottom: 6px;
            border: 1px solid #eee;
            border-radius: 50%;
            background: #fff;
            color: #555;
            font-size: 15px;
        }
        .icon-red {
            border-color: #ffe5e5;
            background: #fff1f0;
            color: #ff4d4f;
            font-size: 11px;
        }
        .bill-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f9f9f9;
            color: #000;
            font-size: 14px;
        }
        .bill-row:last-child {
            border-bottom: none;
        }
        .bill-val {
            font-family: Arial, sans-serif;
            font-size: 15px;
            font-weight: 500;
        }
        .bill-gray {
            display: flex;
            align-items: center;
            color: #999;
            font-size: 13px;
        }
        .bill-tag {
            margin-right: 5px;
            padding: 1px 4px;
            border-radius: 2px;
            background: #ff8000;
            color: #fff;
            font-size: 10px;
        }
        .chevron {
            color: #999;
            font-size: 12px;
        }
        .total-price {
            padding: 20px 0 10px;
            text-align: center;
            color: #000;
            font-family: Arial, sans-serif;
            font-size: 32px;
            font-weight: 700;
        }
        .total-price small {
            font-size: 16px;
        }
        .bill-footer-tips {
            margin-bottom: 12px;
            color: #999;
            font-size: 11px;
            text-align: center;
        }
        .pay-method-row {
            display: flex;
            align-items: center;
            font-size: 14px;
            font-weight: 500;
        }
        .wx-icon {
            margin-right: 8px;
            color: #09bb07;
            font-size: 14px;
            font-weight: 700;
        }
        .check-icon {
            margin-left: auto;
            color: #ff8000;
            opacity: .6;
        }
        .blue-shield-float {
            position: fixed;
            left: 15px;
            bottom: 100px;
            z-index: 90;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 10px;
            background: #274a8c;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
        }
        .pay-wrap {
            margin: 16px 12px 0;
        }
        .btn-pay {
            display: block;
            width: 100%;
            height: 46px;
            border: none;
            border-radius: 23px;
            background: linear-gradient(90deg, #ff9b2f 0%, #ff8000 100%);
            box-shadow: 0 4px 12px rgba(255,128,0,.22);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-pay.btn-disabled {
            background: #d6d6d6;
            box-shadow: none;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div class="cashier-didi">
    <div class="status-bar">
        <span class="back-mark">‹</span>
        <span th:text="${isPaid} ? '已支付' : (${remainingSeconds <= 0} ? '已过期' : '待支付')">待支付</span>
    </div>

    <div class="white-card route-card-full">
        <div class="route-image-wrapper">
            <div class="route-map">
                <div class="route-line"></div>
                <div class="route-node node-start"></div>
                <div class="route-node node-end"></div>
                <div class="addr-text addr-start">当前位置</div>
                <div class="addr-text addr-end">前往 <span th:text="${!#lists.isEmpty(orderItems) and orderItems[0]['shopName'] != null ? orderItems[0]['shopName'] : (order.shopName ?: '目的地')}">目的地</span></div>
            </div>
        </div>
    </div>

    <div class="white-card">
        <div class="driver-header">
            <div>
                <div class="prod-name" th:text="${order.orderName ?: '滴滴行程订单'}">滴滴行程订单</div>
                <div class="driver-info">周师傅 <span class="star-score">5.0</span> 1w+ 单</div>
            </div>
            <div class="driver-avatar-group">
                <div class="car-shape"></div>
                <img th:src="${!#lists.isEmpty(orderItems) and orderItems[0]['image'] != null ? (#strings.startsWith(orderItems[0]['image'], 'http') ? orderItems[0]['image'] : '/api' + orderItems[0]['image']) : 'https://img.yzcdn.cn/vant/cat.jpeg'}" class="car-avatar" alt="driver">
            </div>
        </div>
        <div class="divider"></div>
        <div class="action-row">
            <div class="action-item">
                <div class="action-icon-circle icon-red">110</div>
                紧急
            </div>
            <div class="action-item">
                <div class="action-icon-circle">☎</div>
                打电话
            </div>
            <div class="action-item">
                <div class="action-icon-circle">i</div>
                商家帮助
            </div>
        </div>
    </div>

    <div class="white-card">
        <div class="bill-row">
            <div>行程费用</div>
            <div class="bill-val">¥<span th:text="${order.money}">0.00</span><span class="chevron"> ></span></div>
        </div>
        <div class="bill-row">
            <div>优惠券</div>
            <div class="bill-gray">无可用<span class="chevron"> ></span></div>
        </div>
        <div class="bill-row">
            <div>折上折优惠</div>
            <div class="bill-gray"><span class="bill-tag">暂无优惠</span><span class="chevron"> ></span></div>
        </div>

        <div class="total-price">¥<span th:text="${order.money}">0.00</span> <small>元</small></div>
        <div class="bill-footer-tips">您正在为好友代付车费，取消订单后支付金额将原路退回。</div>

        <div class="divider"></div>
        <div class="pay-method-row">
            <span class="wx-icon">微信</span>
            微信支付
            <span class="check-icon">●</span>
        </div>
    </div>

    <div class="blue-shield-float">盾</div>

    <div class="pay-wrap">
        <button th:if="${isPaid}" class="btn-pay" type="button" onclick="jumpToDidi()">已支付，点击前往官网</button>
        <button th:if="${!isPaid and remainingSeconds <= 0}" class="btn-pay btn-disabled" type="button">订单已过期</button>
        <button th:if="${!isPaid and remainingSeconds > 0}" id="friendPayBtn" class="btn-pay" type="button">立即支付</button>
    </div>
</div>

<script src="https://res2.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
<script th:inline="javascript">
    const outTradeNo = [[${order.outTradeNo}]];
    const expireTimestamp = [[${expireTimestamp}]];
    let paySubmitting = false;
    let timerId = null;

    function getRemainSeconds() {
        if (!expireTimestamp) return 0;
        const diff = expireTimestamp - Date.now();
        if (diff <= 0) return 0;
        return Math.ceil(diff / 1000);
    }

    function isWechat() {
        return /micromessenger/i.test(window.navigator.userAgent);
    }

    function getPayBtn() {
        return document.getElementById('friendPayBtn');
    }

    function setPayBtnState(disabled, text) {
        const btn = getPayBtn();
        if (!btn) return;
        btn.disabled = disabled;
        if (disabled) {
            btn.classList.add('btn-disabled');
        } else {
            btn.classList.remove('btn-disabled');
        }
        if (text) btn.innerText = text;
    }

    function jumpToDidi() {
        window.location.href = 'https://www.didiglobal.com';
    }

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function queryOrderPaid() {
        const resp = await fetch('/api/biz/order/query?outTradeNo=' + encodeURIComponent(outTradeNo), {
            method: 'GET',
            credentials: 'same-origin'
        });
        const res = await resp.json();
        if (!res || res.code !== 200 || !res.data) return false;
        const order = res.data;
        return order.status === '1' || order.status === 1;
    }

    function updateTimer() {
        const remain = getRemainSeconds();
        if (remain <= 0) {
            setPayBtnState(true, '订单已过期');
            if (timerId) {
                clearInterval(timerId);
                timerId = null;
            }
            return;
        }
        if (!paySubmitting) {
            setPayBtnState(false, '立即支付');
        }
    }

    function invokeJsapiPay(payParams) {
        async function handlePaySuccess() {
            try {
                setPayBtnState(true, '正在确认支付结果...');
                for (let i = 0; i < 6; i++) {
                    const paid = await queryOrderPaid();
                    if (paid) {
                        window.location.reload();
                        return;
                    }
                    await sleep(1500);
                }
                window.location.reload();
            } catch (e) {
                console.error('查单失败', e);
                window.location.reload();
            }
        }

        function onBridgeReady() {
            WeixinJSBridge.invoke(
                'getBrandWCPayRequest',
                {
                    appId: payParams.appId,
                    timeStamp: payParams.timeStamp,
                    nonceStr: payParams.nonceStr,
                    package: payParams.packageValue || payParams.package,
                    signType: payParams.signType || 'MD5',
                    paySign: payParams.paySign
                },
                async function (res) {
                    paySubmitting = false;
                    if (res.err_msg === 'get_brand_wcpay_request:ok') {
                        await handlePaySuccess();
                        return;
                    }
                    if (getRemainSeconds() > 0) {
                        setPayBtnState(false, '立即支付');
                    } else {
                        setPayBtnState(true, '订单已过期');
                    }
                    if (res.err_msg !== 'get_brand_wcpay_request:cancel') {
                        alert('支付未完成：' + res.err_msg);
                    }
                }
            );
        }

        if (typeof WeixinJSBridge === 'undefined') {
            document.addEventListener('WeixinJSBridgeReady', onBridgeReady, false);
        } else {
            onBridgeReady();
        }
    }

    async function submitFriendPay() {
        if (paySubmitting) return;
        if (getRemainSeconds() <= 0) {
            setPayBtnState(true, '订单已过期');
            return;
        }
        paySubmitting = true;
        setPayBtnState(true, '正在调起支付...');
        try {
            const resp = await fetch('/api/biz/order/pay', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'same-origin',
                body: JSON.stringify({
                    tradeNo: outTradeNo
                })
            });
            const res = await resp.json();
            if (!res || res.code !== 200 || !res.data) {
                paySubmitting = false;
                if (getRemainSeconds() > 0) {
                    setPayBtnState(false, '立即支付');
                } else {
                    setPayBtnState(true, '订单已过期');
                }
                alert((res && res.msg) || '发起支付失败');
                return;
            }
            const payData = res.data;
            if (payData.payScene === 'JSAPI' && payData.payParams) {
                if (!isWechat()) {
                    paySubmitting = false;
                    updateTimer();
                    alert('请在微信内打开页面完成支付');
                    return;
                }
                invokeJsapiPay(payData.payParams);
                return;
            }
            
            if (payData.payScene === 'H5' && payData.h5Url) {
                window.location.href = payData.h5Url;
                return;
            }
            
            paySubmitting = false;
            updateTimer();
            alert('发起支付失败');
        } catch (e) {
            paySubmitting = false;
            if (getRemainSeconds() > 0) {
                setPayBtnState(false, '立即支付');
            } else {
                setPayBtnState(true, '订单已过期');
            }
            alert('支付请求异常');
            console.error(e);
        }
    }

    const payBtn = getPayBtn();
    if (payBtn) payBtn.addEventListener('click', submitFriendPay);

    updateTimer();
    timerId = setInterval(updateTimer, 1000);

    async function initWechatShare() {
        if (!isWechat()) return;
        try {
            const signUrl = window.location.href.split('#')[0];
            const apiUrl = '/api/biz/wechat/jsapi/signature?url=' + encodeURIComponent(signUrl);
            const resp = await fetch(apiUrl, {
                method: 'GET',
                credentials: 'same-origin'
            });
            const res = await resp.json();
            if (!res || res.code !== 200 || !res.data) {
                console.error('获取微信签名失败:', res);
                return;
            }
            const config = res.data;
            wx.config({
                debug: false,
                appId: config.appId,
                timestamp: config.timestamp,
                nonceStr: config.nonceStr,
                signature: config.signature,
                jsApiList: [
                    'updateAppMessageShareData',
                    'onMenuShareAppMessage'
                ]
            });
            wx.ready(function () {
                const shareData = {
                    title: [[${shareTitle}]],
                    desc: [[${shareDesc}]],
                    link: [[${shareUrl}]],
                    imgUrl: [[${shareImage}]]
                };
                if (typeof wx.onMenuShareAppMessage === 'function') {
                    wx.onMenuShareAppMessage(shareData);
                }
                if (typeof wx.updateAppMessageShareData === 'function') {
                    wx.updateAppMessageShareData(shareData);
                }
            });
            wx.error(function (err) {
                console.error('微信 JSSDK 配置失败:', err);
            });
        } catch (e) {
            console.error('初始化微信分享失败', e);
        }
    }

    initWechatShare();
</script>
</body>
</html>
