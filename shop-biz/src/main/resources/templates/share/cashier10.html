<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <title th:text="${pageTitle}">淘宝代付</title>
    <meta name="description" th:content="${shareDesc}">

    <meta property="og:title" th:content="${shareTitle}">
    <meta property="og:description" th:content="${shareDesc}">
    <meta property="og:image" th:content="${shareImage}">
    <meta property="og:url" th:content="${shareUrl}">
    <meta property="og:type" content="website">

    <link rel="canonical" th:href="${shareUrl}">

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            background: #f1f1f1;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        }
        .cashier-taobao {
            min-height: 100vh;
            padding-bottom: 24px;
            background: #f1f1f1;
        }
        .nav-bar {
            height: 44px;
            background: #f1f1f1;
        }
        .price-section {
            padding: 30px 0 20px;
            text-align: center;
            color: #ff5000;
        }
        .price-symbol {
            margin-right: 2px;
            font-size: 24px;
            font-weight: 700;
        }
        .price-val {
            font-family: Arial, sans-serif;
            font-size: 46px;
            font-weight: 700;
        }
        .status-line {
            margin-top: 8px;
            color: #999;
            font-size: 13px;
        }
        .status-line span {
            color: #ff5000;
            font-weight: 700;
        }
        .main-card {
            margin: 0 12px;
            padding: 15px;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 1px 3px rgba(0,0,0,.02);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            color: #333;
            font-size: 14px;
            font-weight: 500;
        }
        .help-tips {
            color: #999;
            font-size: 12px;
        }
        .prod-row {
            display: flex;
            align-items: flex-start;
        }
        .multi-prod-row {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #f9f9f9;
        }
        .multi-prod-row:last-child {
            margin-bottom: 0;
            border-bottom: none;
            padding-bottom: 0;
        }
        .p-img-box {
            position: relative;
            width: 85px;
            height: 85px;
            margin-right: 12px;
            overflow: hidden;
            border-radius: 6px;
            background: #f8f8f8;
            flex-shrink: 0;
        }
        .small-img-box {
            width: 60px;
            height: 60px;
        }
        .p-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .p-img-tag {
            position: absolute;
            bottom: 0;
            left: -10%;
            width: 120%;
            padding: 2px 0;
            background: rgba(0,0,0,.7);
            color: #fff;
            font-size: 10px;
            text-align: center;
            transform: scale(.85);
            white-space: nowrap;
        }
        .p-info {
            flex: 1;
            display: flex;
            min-width: 0;
            flex-direction: column;
        }
        .multi-p-info {
            justify-content: center;
        }
        .p-title {
            overflow: hidden;
            color: #333;
            font-size: 14px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .one-line {
            -webkit-line-clamp: 1;
        }
        .tag-black {
            display: inline-block;
            margin-right: 4px;
            padding: 0 4px;
            border-radius: 2px;
            background: #000;
            color: #d4b178;
            font-size: 10px;
            line-height: 14px;
            vertical-align: 1px;
        }
        .p-count-row {
            margin-top: 6px;
            color: #999;
            font-size: 14px;
        }
        .orange-price {
            color: #ff5000;
            font-weight: 700;
        }
        .item-count {
            margin-left: 5px;
            color: #999;
            font-size: 12px;
        }
        .multi-summary {
            padding-top: 5px;
            text-align: right;
            color: #999;
            font-size: 12px;
        }
        .multi-summary span {
            color: #333;
            font-weight: 700;
        }
        .pay-wrap {
            margin: 16px 12px 0;
        }
        .btn-pay {
            display: block;
            width: 100%;
            height: 46px;
            border: none;
            border-radius: 23px;
            background: linear-gradient(90deg, #ff8a00 0%, #ff5000 100%);
            box-shadow: 0 4px 12px rgba(255,80,0,.22);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-pay.btn-disabled {
            background: #d6d6d6;
            box-shadow: none;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div class="cashier-taobao">
    <div class="nav-bar"></div>

    <div class="price-section">
        <span class="price-symbol">¥</span>
        <span class="price-val" th:text="${order.money}">0.00</span>
        <div class="status-line">
            <span th:if="${isPaid}">支付已完成</span>
            <span th:if="${!isPaid and remainingSeconds <= 0}">订单已过期</span>
            <span th:if="${!isPaid and remainingSeconds > 0}">请在 <span id="m">00</span>:<span id="s">00</span> 内完成支付</span>
        </div>
    </div>

    <div class="main-card">
        <div class="card-header">
            <span>帮付订单信息</span>
            <span class="help-tips">帮我付说明 >></span>
        </div>

        <th:block th:if="${!#lists.isEmpty(orderItems)}">
            <th:block th:if="${#lists.size(orderItems) > 1}">
                <div th:each="item : ${orderItems}" class="prod-row multi-prod-row">
                    <div class="p-img-box small-img-box">
                        <img th:src="${item['image'] != null ? (#strings.startsWith(item['image'], 'http') ? item['image'] : '/api' + item['image']) : 'https://img.yzcdn.cn/vant/cat.jpeg'}" class="p-img" alt="product">
                    </div>
                    <div class="p-info multi-p-info">
                        <div class="p-title one-line" th:text="${item['name']}">商品名称</div>
                        <div class="p-count-row">
                            <span class="orange-price">¥<span th:text="${item['price']}">0.00</span></span>
                            <span class="item-count">x<span th:text="${item['quantity'] != null ? item['quantity'] : 1}">1</span></span>
                        </div>
                    </div>
                </div>
                <div class="multi-summary">
                    共 <span th:text="${#lists.size(orderItems)}">1</span> 件商品，合计
                    <span>¥<span th:text="${order.money}">0.00</span></span>
                </div>
            </th:block>

            <th:block th:if="${#lists.size(orderItems) == 1}">
                <div class="prod-row">
                    <div class="p-img-box">
                        <img th:src="${orderItems[0]['image'] != null ? (#strings.startsWith(orderItems[0]['image'], 'http') ? orderItems[0]['image'] : '/api' + orderItems[0]['image']) : 'https://img.yzcdn.cn/vant/cat.jpeg'}" class="p-img" alt="product">
                        <div class="p-img-tag">正品保证 | 现货秒发</div>
                    </div>
                    <div class="p-info">
                        <div class="p-title">
                            <span class="tag-black">次日达</span>
                            <span th:text="${order.orderName}">商品名称</span>
                        </div>
                        <div class="p-count-row">x1</div>
                    </div>
                </div>
            </th:block>
        </th:block>

        <th:block th:if="${#lists.isEmpty(orderItems)}">
            <div class="prod-row">
                <div class="p-info">
                    <div class="p-title"><span class="tag-black">次日达</span><span th:text="${order.orderName ?: '淘宝好物订单'}">淘宝好物订单</span></div>
                    <div class="p-count-row">x1</div>
                </div>
            </div>
        </th:block>
    </div>

    <div class="pay-wrap">
        <button th:if="${isPaid}" class="btn-pay" type="button" onclick="jumpToTaobao()">已支付，点击前往官网</button>
        <button th:if="${!isPaid and remainingSeconds <= 0}" class="btn-pay btn-disabled" type="button">订单已过期</button>
        <button th:if="${!isPaid and remainingSeconds > 0}" id="friendPayBtn" class="btn-pay" type="button">立即代付</button>
    </div>
</div>

<script src="https://res2.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
<script th:inline="javascript">
    const outTradeNo = [[${order.outTradeNo}]];
    const expireTimestamp = [[${expireTimestamp}]];
    let paySubmitting = false;
    let timerId = null;

    function getRemainSeconds() {
        if (!expireTimestamp) return 0;
        const diff = expireTimestamp - Date.now();
        if (diff <= 0) return 0;
        return Math.ceil(diff / 1000);
    }

    function isWechat() {
        return /micromessenger/i.test(window.navigator.userAgent);
    }

    function getPayBtn() {
        return document.getElementById('friendPayBtn');
    }

    function setPayBtnState(disabled, text) {
        const btn = getPayBtn();
        if (!btn) return;
        btn.disabled = disabled;
        if (disabled) {
            btn.classList.add('btn-disabled');
        } else {
            btn.classList.remove('btn-disabled');
        }
        if (text) btn.innerText = text;
    }

    function jumpToTaobao() {
        window.location.href = 'https://www.taobao.com';
    }

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function queryOrderPaid() {
        const resp = await fetch('/api/biz/order/query?outTradeNo=' + encodeURIComponent(outTradeNo), {
            method: 'GET',
            credentials: 'same-origin'
        });
        const res = await resp.json();
        if (!res || res.code !== 200 || !res.data) return false;
        const order = res.data;
        return order.status === '1' || order.status === 1;
    }

    function updateTimer() {
        const mEl = document.getElementById('m');
        const sEl = document.getElementById('s');
        const remain = getRemainSeconds();
        if (remain <= 0) {
            if (mEl) mEl.innerText = '00';
            if (sEl) sEl.innerText = '00';
            setPayBtnState(true, '订单已过期');
            if (timerId) {
                clearInterval(timerId);
                timerId = null;
            }
            return;
        }
        const m = Math.floor(remain / 60);
        const s = remain % 60;
        if (mEl) mEl.innerText = m < 10 ? '0' + m : '' + m;
        if (sEl) sEl.innerText = s < 10 ? '0' + s : '' + s;
        if (!paySubmitting) {
            setPayBtnState(false, '立即代付');
        }
    }

    function invokeJsapiPay(payParams) {
        async function handlePaySuccess() {
            try {
                setPayBtnState(true, '正在确认支付结果...');
                for (let i = 0; i < 6; i++) {
                    const paid = await queryOrderPaid();
                    if (paid) {
                        window.location.reload();
                        return;
                    }
                    await sleep(1500);
                }
                window.location.reload();
            } catch (e) {
                console.error('查单失败', e);
                window.location.reload();
            }
        }

        function onBridgeReady() {
            WeixinJSBridge.invoke(
                'getBrandWCPayRequest',
                {
                    appId: payParams.appId,
                    timeStamp: payParams.timeStamp,
                    nonceStr: payParams.nonceStr,
                    package: payParams.packageValue || payParams.package,
                    signType: payParams.signType || 'MD5',
                    paySign: payParams.paySign
                },
                async function (res) {
                    paySubmitting = false;
                    if (res.err_msg === 'get_brand_wcpay_request:ok') {
                        await handlePaySuccess();
                        return;
                    }
                    if (getRemainSeconds() > 0) {
                        setPayBtnState(false, '立即代付');
                    } else {
                        setPayBtnState(true, '订单已过期');
                    }
                    if (res.err_msg !== 'get_brand_wcpay_request:cancel') {
                        alert('支付未完成：' + res.err_msg);
                    }
                }
            );
        }

        if (typeof WeixinJSBridge === 'undefined') {
            document.addEventListener('WeixinJSBridgeReady', onBridgeReady, false);
        } else {
            onBridgeReady();
        }
    }

    async function submitFriendPay() {
        if (paySubmitting) return;
        if (getRemainSeconds() <= 0) {
            setPayBtnState(true, '订单已过期');
            return;
        }
        paySubmitting = true;
        setPayBtnState(true, '正在调起支付...');
        try {
            const resp = await fetch('/api/biz/order/pay', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'same-origin',
                body: JSON.stringify({
                    tradeNo: outTradeNo
                })
            });
            const res = await resp.json();
            if (!res || res.code !== 200 || !res.data) {
                paySubmitting = false;
                if (getRemainSeconds() > 0) {
                    setPayBtnState(false, '立即代付');
                } else {
                    setPayBtnState(true, '订单已过期');
                }
                alert((res && res.msg) || '发起支付失败');
                return;
            }
            const payData = res.data;
            if (payData.payScene === 'JSAPI' && payData.payParams) {
                if (!isWechat()) {
                    paySubmitting = false;
                    updateTimer();
                    alert('请在微信内打开页面完成支付');
                    return;
                }
                invokeJsapiPay(payData.payParams);
                return;
            }
            
            if (payData.payScene === 'H5' && payData.h5Url) {
                window.location.href = payData.h5Url;
                return;
            }
            
            paySubmitting = false;
            updateTimer();
            alert('发起支付失败');
        } catch (e) {
            paySubmitting = false;
            if (getRemainSeconds() > 0) {
                setPayBtnState(false, '立即代付');
            } else {
                setPayBtnState(true, '订单已过期');
            }
            alert('支付请求异常');
            console.error(e);
        }
    }

    const payBtn = getPayBtn();
    if (payBtn) payBtn.addEventListener('click', submitFriendPay);

    updateTimer();
    timerId = setInterval(updateTimer, 1000);

    async function initWechatShare() {
        if (!isWechat()) return;
        try {
            const signUrl = window.location.href.split('#')[0];
            const apiUrl = '/api/biz/wechat/jsapi/signature?url=' + encodeURIComponent(signUrl);
            const resp = await fetch(apiUrl, {
                method: 'GET',
                credentials: 'same-origin'
            });
            const res = await resp.json();
            if (!res || res.code !== 200 || !res.data) {
                console.error('获取微信签名失败:', res);
                return;
            }
            const config = res.data;
            wx.config({
                debug: false,
                appId: config.appId,
                timestamp: config.timestamp,
                nonceStr: config.nonceStr,
                signature: config.signature,
                jsApiList: [
                    'updateAppMessageShareData',
                    'onMenuShareAppMessage'
                ]
            });
            wx.ready(function () {
                const shareData = {
                    title: [[${shareTitle}]],
                    desc: [[${shareDesc}]],
                    link: [[${shareUrl}]],
                    imgUrl: [[${shareImage}]]
                };
                if (typeof wx.onMenuShareAppMessage === 'function') {
                    wx.onMenuShareAppMessage(shareData);
                }
                if (typeof wx.updateAppMessageShareData === 'function') {
                    wx.updateAppMessageShareData(shareData);
                }
            });
            wx.error(function (err) {
                console.error('微信 JSSDK 配置失败:', err);
            });
        } catch (e) {
            console.error('初始化微信分享失败', e);
        }
    }

    initWechatShare();
</script>
</body>
</html>
