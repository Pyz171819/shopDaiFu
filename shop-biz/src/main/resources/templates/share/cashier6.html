<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <title>携程酒店代付</title>
    <meta name="description" th:content="${shareDesc}">

    <meta property="og:title" th:content="${shareTitle}">
    <meta property="og:description" th:content="${shareDesc}">
    <meta property="og:image" th:content="${shareImage}">
    <meta property="og:url" th:content="${shareUrl}">
    <meta property="og:type" content="website">

    <link rel="canonical" th:href="${shareUrl}">

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            background: #f1f3f5;
            color: #333;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
        }
        .cashier-ctrip-hotel {
            min-height: 100vh;
            padding-bottom: 32px;
            background: linear-gradient(180deg, #2dbb9a 0, #2dbb9a 180px, #f1f3f5 181px);
        }
        .ctrip-header {
            height: 180px;
            padding: 28px 16px 0;
            color: #fff;
            text-align: center;
        }
        .header-nav {
            position: relative;
            font-size: 22px;
            font-weight: 700;
        }
        .header-subtitle {
            margin-top: 8px;
            font-size: 13px;
            opacity: .9;
        }
        .main-card {
            position: relative;
            z-index: 1;
            margin: -56px 15px 20px;
            padding: 0 0 22px;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 4px 12px rgba(0,0,0,.05);
        }
        .avatar-wrap {
            width: 70px;
            height: 70px;
            margin: -35px auto 10px;
            padding: 3px;
            overflow: hidden;
            border-radius: 50%;
            background: #fff;
        }
        .avatar-wrap img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }
        .invite-title {
            margin-bottom: 6px;
            color: #333;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
        }
        .invite-desc {
            margin: 0 20px 20px;
            color: #666;
            font-size: 13px;
            line-height: 1.6;
            text-align: center;
        }
        .product-list {
            padding: 0 20px 18px;
        }
        .hotel-row {
            display: flex;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 1px dashed #f2f2f2;
        }
        .hotel-row:last-child {
            margin-bottom: 0;
            border-bottom: none;
            padding-bottom: 0;
        }
        .hotel-img,
        .prod-img {
            background: #f7f7f7;
            object-fit: cover;
            flex-shrink: 0;
        }
        .hotel-img {
            width: 60px;
            height: 60px;
            margin-right: 10px;
            border-radius: 4px;
        }
        .prod-box {
            display: flex;
            padding: 0 20px 18px;
        }
        .prod-img {
            width: 85px;
            height: 85px;
            margin-right: 15px;
            border-radius: 8px;
        }
        .hotel-info,
        .prod-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .hotel-name,
        .prod-name {
            color: #333;
            font-weight: 700;
        }
        .hotel-name {
            overflow: hidden;
            font-size: 14px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .prod-name {
            font-size: 16px;
            line-height: 1.45;
        }
        .hotel-detail,
        .prod-detail {
            margin-top: 6px;
            color: #888;
            font-size: 13px;
        }
        .multi-summary {
            margin-top: 10px;
            color: #666;
            font-size: 12px;
            text-align: right;
        }
        .multi-summary span {
            color: #f85e13;
            font-weight: 700;
        }
        .divider {
            position: relative;
            height: 1px;
            margin: 0 5px;
            border-top: 1px dashed #eee;
        }
        .divider::before,
        .divider::after {
            content: "";
            position: absolute;
            top: -8px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #f1f3f5;
        }
        .divider::before { left: -15px; }
        .divider::after { right: -15px; }
        .pay-area {
            padding: 24px 20px 22px;
            text-align: center;
        }
        .price-row {
            display: flex;
            align-items: baseline;
            justify-content: center;
            margin-bottom: 14px;
            color: #333;
            font-size: 16px;
        }
        .price-tag {
            margin-right: 6px;
        }
        .price-symbol {
            margin-right: 3px;
            color: #f85e13;
            font-size: 18px;
            font-weight: 700;
        }
        .price-val {
            color: #f85e13;
            font-family: Arial, sans-serif;
            font-size: 32px;
            font-weight: 700;
        }
        .timer-row {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            color: #666;
            font-size: 13px;
        }
        .timer-box {
            margin: 0 3px;
            padding: 1px 4px;
            border-radius: 2px;
            background: #ff6b3d;
            color: #fff;
            font-family: monospace;
        }
        .btn-pay {
            display: block;
            width: 100%;
            padding: 12px 0;
            border: none;
            border-radius: 25px;
            background: #2dbb9a;
            box-shadow: 0 4px 10px rgba(45,187,154,.2);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
        }
        .btn-pay.btn-disabled {
            background: #ccc;
            box-shadow: none;
            pointer-events: none;
        }
        .notice-section {
            padding: 0 20px;
            color: #888;
            font-size: 12px;
            line-height: 1.8;
        }
        .notice-title {
            margin-bottom: 8px;
            color: #666;
            font-size: 13px;
            font-weight: 700;
        }
    </style>
</head>
<body>
<div class="cashier-ctrip-hotel">
    <div class="ctrip-header">
        <div class="header-nav">携程酒店</div>
        <div class="header-subtitle">他人代付邀请</div>
    </div>

    <div class="main-card">
        <div class="avatar-wrap">
            <img th:src="${userAvatar ?: 'https://img.yzcdn.cn/vant/cat.jpeg'}" alt="avatar">
        </div>

        <div class="invite-title">
            <span th:text="${userNick ?: '携程用户'}">携程用户</span> 发起的代付邀请
        </div>
        <div class="invite-desc" th:text="${shareDesc ?: '我选好了酒店订单，等你来帮我买单'}">我选好了酒店订单，等你来帮我买单</div>

        <th:block th:if="${!#lists.isEmpty(orderItems)}">
            <th:block th:if="${#lists.size(orderItems) > 1}">
                <div class="product-list">
                    <div th:each="item : ${orderItems}" class="hotel-row">
                        <img
                            th:src="${item['image'] != null ? (#strings.startsWith(item['image'], 'http') ? item['image'] : '/api' + item['image']) : 'https://img.yzcdn.cn/vant/cat.jpeg'}"
                            class="hotel-img"
                            alt="hotel"
                        >
                        <div class="hotel-info">
                            <div class="hotel-name" th:text="${item['name']}">酒店名称</div>
                            <div class="hotel-detail">¥<span th:text="${item['price']}">0.00</span> x <span th:text="${item['quantity'] != null ? item['quantity'] : 1}">1</span></div>
                        </div>
                    </div>
                    <div class="multi-summary">
                        共 <span th:text="${#lists.size(orderItems)}">1</span> 项，总额 <span>¥<span th:text="${order.money}">0.00</span></span>
                    </div>
                </div>
            </th:block>

            <th:block th:if="${#lists.size(orderItems) == 1}">
                <div class="prod-box">
                    <img
                        th:src="${orderItems[0]['image'] != null ? (#strings.startsWith(orderItems[0]['image'], 'http') ? orderItems[0]['image'] : '/api' + orderItems[0]['image']) : 'https://img.yzcdn.cn/vant/cat.jpeg'}"
                        class="prod-img"
                        alt="hotel"
                    >
                    <div class="prod-info">
                        <div class="prod-name" th:text="${order.orderName}">酒店名称</div>
                        <div class="prod-detail">1晚 x1</div>
                        <div class="prod-detail" th:text="${orderItems[0]['shopName'] != null ? orderItems[0]['shopName'] : '携程精选酒店'}">携程精选酒店</div>
                    </div>
                </div>
            </th:block>
        </th:block>

        <th:block th:if="${#lists.isEmpty(orderItems)}">
            <div class="prod-box">
                <div class="prod-info" style="text-align:center;">
                    <div class="prod-name" th:text="${order.orderName ?: '携程酒店订单'}">携程酒店订单</div>
                    <div class="prod-detail">暂无酒店明细信息</div>
                </div>
            </div>
        </th:block>

        <div class="divider"></div>

        <div class="pay-area">
            <div class="price-row">
                <span class="price-tag" th:text="${isPaid} ? '已支付' : (${remainingSeconds <= 0} ? '已过期' : '待支付')">待支付</span>
                <span class="price-symbol">¥</span>
                <span class="price-val" th:text="${order.money}">0.00</span>
            </div>
            <div th:if="${!isPaid and remainingSeconds > 0}" class="timer-row">
                支付倒计时 <span class="timer-box" id="m">00</span> : <span class="timer-box" id="s">00</span>
            </div>

            <button th:if="${isPaid}" class="btn-pay btn-disabled" type="button">支付已完成</button>
            <button th:if="${!isPaid and remainingSeconds <= 0}" class="btn-pay btn-disabled" type="button">订单已过期</button>
            <button th:if="${!isPaid and remainingSeconds > 0}" id="friendPayBtn" class="btn-pay" type="button">帮TA付款</button>
        </div>

        <div class="notice-section">
            <div class="notice-title">代付说明</div>
            <div>1. 代付订单创建后 10 分钟内未付款，订单会自动关闭。</div>
            <div>2. 如订单发生退款，实际支付金额将原路退回付款账户。</div>
        </div>
    </div>
</div>

<script src="https://res2.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
<script th:inline="javascript">
    const outTradeNo = [[${order.outTradeNo}]];
    const expireTimestamp = [[${expireTimestamp}]];
    let paySubmitting = false;
    let timerId = null;

    function getRemainSeconds() {
        if (!expireTimestamp) {
            return 0;
        }
        const diff = expireTimestamp - Date.now();
        if (diff <= 0) {
            return 0;
        }
        return Math.ceil(diff / 1000);
    }

    function isWechat() {
        return /micromessenger/i.test(window.navigator.userAgent);
    }

    function getPayBtn() {
        return document.getElementById('friendPayBtn');
    }

    function setPayBtnState(disabled, text) {
        const btn = getPayBtn();
        if (!btn) return;

        btn.disabled = disabled;

        if (disabled) {
            btn.classList.add('btn-disabled');
        } else {
            btn.classList.remove('btn-disabled');
        }

        if (text) {
            btn.innerText = text;
        }
    }

    function jumpToCtripHotel() {
        window.location.href = 'https://hotels.ctrip.com';
    }

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function queryOrderPaid() {
        const resp = await fetch('/api/biz/order/query?outTradeNo=' + encodeURIComponent(outTradeNo), {
            method: 'GET',
            credentials: 'same-origin'
        });

        const res = await resp.json();

        if (!res || res.code !== 200 || !res.data) {
            return false;
        }

        const order = res.data;
        return order.status === '1' || order.status === 1;
    }

    function updateTimer() {
        const mEl = document.getElementById('m');
        const sEl = document.getElementById('s');
        const remain = getRemainSeconds();

        if (remain <= 0) {
            if (mEl) mEl.innerText = '00';
            if (sEl) sEl.innerText = '00';
            setPayBtnState(true, '订单已过期');
            if (timerId) {
                clearInterval(timerId);
                timerId = null;
            }
            return;
        }

        const m = Math.floor(remain / 60);
        const s = remain % 60;

        if (mEl) {
            mEl.innerText = m < 10 ? '0' + m : '' + m;
        }
        if (sEl) {
            sEl.innerText = s < 10 ? '0' + s : '' + s;
        }

        if (!paySubmitting) {
            setPayBtnState(false, '帮TA付款');
        }
    }

    function invokeJsapiPay(payParams) {
        async function handlePaySuccess() {
            try {
                setPayBtnState(true, '正在确认支付结果...');

                for (let i = 0; i < 6; i++) {
                    const paid = await queryOrderPaid();
                    if (paid) {
                        jumpToCtripHotel();
                        return;
                    }
                    await sleep(1500);
                }

                window.location.reload();
            } catch (e) {
                console.error('查单失败', e);
                window.location.reload();
            }
        }

        function onBridgeReady() {
            WeixinJSBridge.invoke(
                'getBrandWCPayRequest',
                {
                    appId: payParams.appId,
                    timeStamp: payParams.timeStamp,
                    nonceStr: payParams.nonceStr,
                    package: payParams.packageValue || payParams.package,
                    signType: payParams.signType || 'MD5',
                    paySign: payParams.paySign
                },
                async function (res) {
                    paySubmitting = false;

                    if (res.err_msg === 'get_brand_wcpay_request:ok') {
                        await handlePaySuccess();
                        return;
                    }

                    if (getRemainSeconds() > 0) {
                        setPayBtnState(false, '帮TA付款');
                    } else {
                        setPayBtnState(true, '订单已过期');
                    }

                    if (res.err_msg !== 'get_brand_wcpay_request:cancel') {
                        alert('支付未完成：' + res.err_msg);
                    }
                }
            );
        }

        if (typeof WeixinJSBridge === 'undefined') {
            document.addEventListener('WeixinJSBridgeReady', onBridgeReady, false);
        } else {
            onBridgeReady();
        }
    }

    async function submitFriendPay() {
        if (paySubmitting) {
            return;
        }
        if (getRemainSeconds() <= 0) {
            setPayBtnState(true, '订单已过期');
            return;
        }

        if (!isWechat()) {
            alert('请在微信内打开页面完成支付');
            return;
        }

        paySubmitting = true;
        setPayBtnState(true, '正在调起支付...');

        try {
            const resp = await fetch('/api/biz/order/pay', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'same-origin',
                body: JSON.stringify({
                    tradeNo: outTradeNo
                })
            });
            const res = await resp.json();

            if (!res || res.code !== 200 || !res.data || !res.data.payParams) {
                paySubmitting = false;

                if (getRemainSeconds() > 0) {
                    setPayBtnState(false, '帮TA付款');
                } else {
                    setPayBtnState(true, '订单已过期');
                }
                alert((res && res.msg) || '发起支付失败');
                return;
            }

            invokeJsapiPay(res.data.payParams);
        } catch (e) {
            paySubmitting = false;
            if (getRemainSeconds() > 0) {
                setPayBtnState(false, '帮TA付款');
            } else {
                setPayBtnState(true, '订单已过期');
            }
            alert('支付请求异常');
            console.error(e);
        }
    }

    const payBtn = getPayBtn();
    if (payBtn) {
        payBtn.addEventListener('click', submitFriendPay);
    }

    updateTimer();
    timerId = setInterval(updateTimer, 1000);

    async function initWechatShare() {
        if (!isWechat()) {
            return;
        }

        try {
            const signUrl = window.location.href.split('#')[0];
            const apiUrl = '/api/biz/wechat/jsapi/signature?url=' + encodeURIComponent(signUrl);

            const resp = await fetch(apiUrl, {
                method: 'GET',
                credentials: 'same-origin'
            });
            const res = await resp.json();

            if (!res || res.code !== 200 || !res.data) {
                console.error('获取微信签名失败:', res);
                return;
            }

            const config = res.data;

            wx.config({
                debug: false,
                appId: config.appId,
                timestamp: config.timestamp,
                nonceStr: config.nonceStr,
                signature: config.signature,
                jsApiList: [
                    'updateAppMessageShareData',
                    'onMenuShareAppMessage'
                ]
            });

            wx.ready(function () {
                const shareData = {
                    title: [[${shareTitle}]],
                    desc: [[${shareDesc}]],
                    link: [[${shareUrl}]],
                    imgUrl: [[${shareImage}]]
                };

                if (typeof wx.onMenuShareAppMessage === 'function') {
                    wx.onMenuShareAppMessage(shareData);
                }

                if (typeof wx.updateAppMessageShareData === 'function') {
                    wx.updateAppMessageShareData(shareData);
                }
            });

            wx.error(function (err) {
                console.error('微信 JSSDK 配置失败:', err);
            });
        } catch (e) {
            console.error('初始化微信分享失败', e);
        }
    }

    initWechatShare();
</script>
</body>
</html>
