<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <title>闲鱼宝贝</title>
    <meta name="description" th:content="${shareDesc}">

    <meta property="og:title" th:content="${shareTitle}">
    <meta property="og:description" th:content="${shareDesc}">
    <meta property="og:image" th:content="${shareImage}">
    <meta property="og:url" th:content="${shareUrl}">
    <meta property="og:type" content="website">

    <link rel="canonical" th:href="${shareUrl}">

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            background: #fff;
            color: #111;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        }
        .cashier-xianyu {
            min-height: 100vh;
            padding-bottom: 24px;
            background: #fff;
        }
        .header {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background: #fff;
        }
        .u-avatar {
            width: 36px;
            height: 36px;
            margin-right: 10px;
            border: 1px solid #f0f0f0;
            border-radius: 50%;
            object-fit: cover;
        }
        .u-info {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .u-left-group {
            display: flex;
            align-items: center;
        }
        .u-name {
            margin-right: 6px;
            color: #111;
            font-size: 15px;
            font-weight: 700;
        }
        .u-tag {
            display: flex;
            align-items: center;
            padding: 1px 4px;
            border-radius: 2px;
            background: #e6f1fc;
            color: #108ee9;
            font-size: 10px;
            font-weight: 700;
            white-space: nowrap;
        }
        .u-status {
            color: #999;
            font-size: 11px;
            text-align: right;
            white-space: nowrap;
        }
        .price-section {
            display: flex;
            align-items: flex-end;
            padding: 5px 15px;
        }
        .p-symbol {
            margin-bottom: 3px;
            color: #ff2b2b;
            font-size: 18px;
            font-weight: 700;
        }
        .p-val {
            color: #ff2b2b;
            font-family: Arial, sans-serif;
            font-size: 32px;
            font-weight: 700;
            line-height: 1;
        }
        .p-badge-red {
            margin-bottom: 4px;
            margin-left: 8px;
            padding: 2px 5px;
            border-radius: 4px;
            background: rgba(255,43,43,.08);
            color: #ff2b2b;
            font-size: 11px;
        }
        .p-sub-row {
            margin-top: 5px;
            padding: 0 15px;
        }
        .p-sub-tag {
            display: inline-block;
            padding: 0 2px;
            border: 1px solid #ff2b2b;
            border-radius: 2px;
            color: #ff2b2b;
            font-size: 10px;
        }
        .p-stats-row {
            display: flex;
            align-items: center;
            margin-top: 8px;
            padding: 0 15px;
            color: #999;
            font-size: 12px;
        }
        .text-del {
            margin: 0 2px;
            text-decoration: line-through;
        }
        .content {
            padding: 10px 15px 0;
        }
        .safety-tip {
            margin-bottom: 15px;
            color: #333;
            font-size: 12px;
            line-height: 1.6;
        }
        .st-title {
            display: flex;
            align-items: center;
            margin-bottom: 4px;
            font-weight: 700;
        }
        .info-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 14px;
            height: 14px;
            margin-left: 4px;
            border-radius: 50%;
            background: #eee;
            color: #999;
            font-size: 10px;
        }
        .st-desc {
            display: block;
            color: #999;
        }
        .c-text {
            display: block;
            margin: 0 0 20px;
            color: #000;
            font-size: 16px;
            font-weight: 500;
            line-height: 1.6;
            text-align: left;
            white-space: pre-wrap;
        }
        .prod-img-box {
            margin-bottom: 20px;
            padding: 0 15px;
        }
        .prod-img {
            display: block;
            width: 100%;
            border-radius: 12px;
        }
        .pay-wrap {
            margin: 0 15px;
        }
        .btn-pay {
            display: block;
            width: 100%;
            height: 46px;
            border: none;
            border-radius: 23px;
            background: linear-gradient(90deg, #ffd84f 0%, #ffda44 100%);
            box-shadow: 0 4px 12px rgba(255,218,68,.24);
            color: #5a4700;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-pay.btn-disabled {
            background: #e2e2e2;
            box-shadow: none;
            color: #888;
            pointer-events: none;
        }
        .status-line {
            margin: 4px 15px 14px;
            color: #999;
            font-size: 12px;
        }
        .status-line span {
            color: #ff2b2b;
            font-weight: 700;
        }
    </style>
</head>
<body>
<div class="cashier-xianyu">
    <div class="header">
        <img th:src="${userAvatar ?: 'https://img.yzcdn.cn/vant/cat.jpeg'}" class="u-avatar" alt="seller">
        <div class="u-info">
            <div class="u-left-group">
                <div class="u-name" th:text="${order.shopName ?: '卖家'}">卖家</div>
                <div class="u-tag">鱼小铺 L1</div>
            </div>
            <div class="u-status">1小时前来过 | 济南</div>
        </div>
    </div>

    <div class="price-section">
        <span class="p-symbol">¥</span>
        <span class="p-val" th:text="${order.money}">0.00</span>
        <span class="p-badge-red">2人小刀价</span>
    </div>

    <div class="p-sub-row">
        <span class="p-sub-tag">包邮</span>
    </div>

    <div class="p-stats-row">
        直接买 <span class="text-del">¥<span th:text="${originalPrice}">0.00</span></span> | 2人想要 | 128人浏览
    </div>

    <div class="status-line">
        <span th:if="${isPaid}">支付已完成</span>
        <span th:if="${!isPaid and remainingSeconds <= 0}">订单已过期</span>
        <span th:if="${!isPaid and remainingSeconds > 0}">请尽快完成支付</span>
    </div>

    <div class="content">
        <div class="safety-tip">
            <div class="st-title">闲鱼交易须知 <span class="info-mark">i</span></div>
            <div class="st-desc">买前了解退货规则，保障你的交易权益</div>
        </div>

        <div class="c-text" th:text="${order.orderName ?: '帮我看看闲鱼宝贝'}">帮我看看闲鱼宝贝</div>
    </div>

    <div class="prod-img-box">
        <img th:src="${!#lists.isEmpty(orderItems) and orderItems[0]['image'] != null ? (#strings.startsWith(orderItems[0]['image'], 'http') ? orderItems[0]['image'] : '/api' + orderItems[0]['image']) : 'https://img.yzcdn.cn/vant/cat.jpeg'}" class="prod-img" alt="product">
    </div>

    <div class="pay-wrap">
        <button th:if="${isPaid}" class="btn-pay btn-disabled" type="button">支付已完成</button>
        <button th:if="${!isPaid and remainingSeconds <= 0}" class="btn-pay btn-disabled" type="button">订单已过期</button>
        <button th:if="${!isPaid and remainingSeconds > 0}" id="friendPayBtn" class="btn-pay" type="button">立即支付</button>
    </div>
</div>

<script src="https://res2.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
<script th:inline="javascript">
    const outTradeNo = [[${order.outTradeNo}]];
    const expireTimestamp = [[${expireTimestamp}]];
    let paySubmitting = false;
    let timerId = null;

    function getRemainSeconds() {
        if (!expireTimestamp) return 0;
        const diff = expireTimestamp - Date.now();
        if (diff <= 0) return 0;
        return Math.ceil(diff / 1000);
    }

    function isWechat() {
        return /micromessenger/i.test(window.navigator.userAgent);
    }

    function getPayBtn() {
        return document.getElementById('friendPayBtn');
    }

    function setPayBtnState(disabled, text) {
        const btn = getPayBtn();
        if (!btn) return;
        btn.disabled = disabled;
        if (disabled) {
            btn.classList.add('btn-disabled');
        } else {
            btn.classList.remove('btn-disabled');
        }
        if (text) btn.innerText = text;
    }

    function jumpToXianyu() {
        window.location.href = 'https://2.taobao.com';
    }

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function queryOrderPaid() {
        const resp = await fetch('/api/biz/order/query?outTradeNo=' + encodeURIComponent(outTradeNo), {
            method: 'GET',
            credentials: 'same-origin'
        });
        const res = await resp.json();
        if (!res || res.code !== 200 || !res.data) return false;
        const order = res.data;
        return order.status === '1' || order.status === 1;
    }

    function updateTimer() {
        const remain = getRemainSeconds();
        if (remain <= 0) {
            setPayBtnState(true, '订单已过期');
            if (timerId) {
                clearInterval(timerId);
                timerId = null;
            }
            return;
        }
        if (!paySubmitting) {
            setPayBtnState(false, '立即支付');
        }
    }

    function invokeJsapiPay(payParams) {
        async function handlePaySuccess() {
            try {
                setPayBtnState(true, '正在确认支付结果...');
                for (let i = 0; i < 6; i++) {
                    const paid = await queryOrderPaid();
                    if (paid) {
                        jumpToXianyu();
                        return;
                    }
                    await sleep(1500);
                }
                window.location.reload();
            } catch (e) {
                console.error('查单失败', e);
                window.location.reload();
            }
        }

        function onBridgeReady() {
            WeixinJSBridge.invoke(
                'getBrandWCPayRequest',
                {
                    appId: payParams.appId,
                    timeStamp: payParams.timeStamp,
                    nonceStr: payParams.nonceStr,
                    package: payParams.packageValue || payParams.package,
                    signType: payParams.signType || 'MD5',
                    paySign: payParams.paySign
                },
                async function (res) {
                    paySubmitting = false;
                    if (res.err_msg === 'get_brand_wcpay_request:ok') {
                        await handlePaySuccess();
                        return;
                    }
                    if (getRemainSeconds() > 0) {
                        setPayBtnState(false, '立即支付');
                    } else {
                        setPayBtnState(true, '订单已过期');
                    }
                    if (res.err_msg !== 'get_brand_wcpay_request:cancel') {
                        alert('支付未完成：' + res.err_msg);
                    }
                }
            );
        }

        if (typeof WeixinJSBridge === 'undefined') {
            document.addEventListener('WeixinJSBridgeReady', onBridgeReady, false);
        } else {
            onBridgeReady();
        }
    }

    async function submitFriendPay() {
        if (paySubmitting) return;
        if (getRemainSeconds() <= 0) {
            setPayBtnState(true, '订单已过期');
            return;
        }
        if (!isWechat()) {
            alert('请在微信内打开页面完成支付');
            return;
        }
        paySubmitting = true;
        setPayBtnState(true, '正在调起支付...');
        try {
            const resp = await fetch('/api/biz/order/pay', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'same-origin',
                body: JSON.stringify({
                    tradeNo: outTradeNo
                })
            });
            const res = await resp.json();
            if (!res || res.code !== 200 || !res.data || !res.data.payParams) {
                paySubmitting = false;
                if (getRemainSeconds() > 0) {
                    setPayBtnState(false, '立即支付');
                } else {
                    setPayBtnState(true, '订单已过期');
                }
                alert((res && res.msg) || '发起支付失败');
                return;
            }
            invokeJsapiPay(res.data.payParams);
        } catch (e) {
            paySubmitting = false;
            if (getRemainSeconds() > 0) {
                setPayBtnState(false, '立即支付');
            } else {
                setPayBtnState(true, '订单已过期');
            }
            alert('支付请求异常');
            console.error(e);
        }
    }

    const payBtn = getPayBtn();
    if (payBtn) payBtn.addEventListener('click', submitFriendPay);

    updateTimer();
    timerId = setInterval(updateTimer, 1000);

    async function initWechatShare() {
        if (!isWechat()) return;
        try {
            const signUrl = window.location.href.split('#')[0];
            const apiUrl = '/api/biz/wechat/jsapi/signature?url=' + encodeURIComponent(signUrl);
            const resp = await fetch(apiUrl, {
                method: 'GET',
                credentials: 'same-origin'
            });
            const res = await resp.json();
            if (!res || res.code !== 200 || !res.data) {
                console.error('获取微信签名失败:', res);
                return;
            }
            const config = res.data;
            wx.config({
                debug: false,
                appId: config.appId,
                timestamp: config.timestamp,
                nonceStr: config.nonceStr,
                signature: config.signature,
                jsApiList: [
                    'updateAppMessageShareData',
                    'onMenuShareAppMessage'
                ]
            });
            wx.ready(function () {
                const shareData = {
                    title: [[${shareTitle}]],
                    desc: [[${shareDesc}]],
                    link: [[${shareUrl}]],
                    imgUrl: [[${shareImage}]]
                };
                if (typeof wx.onMenuShareAppMessage === 'function') {
                    wx.onMenuShareAppMessage(shareData);
                }
                if (typeof wx.updateAppMessageShareData === 'function') {
                    wx.updateAppMessageShareData(shareData);
                }
            });
            wx.error(function (err) {
                console.error('微信 JSSDK 配置失败:', err);
            });
        } catch (e) {
            console.error('初始化微信分享失败', e);
        }
    }

    initWechatShare();
</script>
</body>
</html>
