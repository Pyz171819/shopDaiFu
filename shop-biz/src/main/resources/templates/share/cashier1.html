<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <title>京东代付</title>
    <meta name="description" th:content="${shareDesc}">

    <meta property="og:title" th:content="${shareTitle}">
    <meta property="og:description" th:content="${shareDesc}">
    <meta property="og:image" th:content="${shareImage}">
    <meta property="og:url" th:content="${shareUrl}">
    <meta property="og:type" content="website">

    <link rel="canonical" th:href="${shareUrl}">

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            background: #f6f6f6;
            color: #222;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        }
        .cashier-jd {
            min-height: 100vh;
            padding-bottom: 24px;
            background: linear-gradient(180deg, #fff5f1 0, #f6f6f6 220px);
        }
        .header-bg {
            position: relative;
            min-height: 140px;
            overflow: hidden;
            background: linear-gradient(110deg, #ff3131 0%, #ff7b38 100%);
        }
        .header-bg::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 18% 24%, rgba(255,255,255,.26) 0, rgba(255,255,255,0) 22%),
                radial-gradient(circle at 78% 0, rgba(255,255,255,.2) 0, rgba(255,255,255,0) 28%);
        }
        .user-interaction {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: flex-start;
            padding: 22px 15px 44px;
        }
        .u-avatar {
            width: 50px;
            height: 50px;
            margin-top: 10px;
            margin-right: 12px;
            border: 2px solid #fff;
            border-radius: 50%;
            object-fit: cover;
            background: #fff;
            box-shadow: 0 2px 10px rgba(0,0,0,.12);
        }
        .bubble {
            position: relative;
            max-width: 300px;
            padding: 16px 86px 16px 18px;
            border-radius: 18px;
            background: rgba(255,255,255,.95);
            color: #d62010;
            font-size: 14px;
            font-weight: 700;
            line-height: 1.5;
        }
        .bubble::after {
            content: "";
            position: absolute;
            left: -8px;
            top: 26px;
            width: 14px;
            height: 14px;
            transform: rotate(45deg);
            background: rgba(255,255,255,.95);
        }
        .mascot {
            position: absolute;
            right: 8px;
            bottom: -8px;
            width: 68px;
            height: 68px;
            object-fit: contain;
            pointer-events: none;
        }
        .jd-card {
            position: relative;
            margin: 0 12px 12px;
            padding: 20px;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,.04);
            overflow: hidden;
        }
        .amount-card {
            margin-top: -18px;
        }
        .amount-row, .amount-bottom, .pay-row, .prod-price-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .amount-label {
            color: #333;
            font-size: 16px;
            font-weight: 600;
        }
        .receiver-info {
            color: #666;
            font-size: 13px;
        }
        .amount-bottom {
            margin-top: 14px;
            align-items: flex-end;
            gap: 12px;
        }
        .price-large {
            color: #f2270c;
            font-size: 38px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -1px;
        }
        .price-large::before {
            content: "¥";
            margin-right: 2px;
            font-size: 24px;
            font-weight: 500;
        }
        .price-large.paid,
        .price-large.expired {
            color: #b8b8b8;
        }
        .timer-row {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #666;
            font-size: 13px;
            white-space: nowrap;
        }
        .timer-row.muted {
            color: #bbb;
        }
        .timer-box {
            display: flex;
            align-items: center;
            font-variant-numeric: tabular-nums;
        }
        .t-num {
            min-width: 24px;
            margin: 0 2px;
            padding: 2px 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #fff;
            text-align: center;
            font-family: monospace;
        }
        .status-badge {
            position: absolute;
            right: 16px;
            top: 16px;
            padding: 6px 12px;
            border: 2px solid currentColor;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            opacity: .82;
            transform: rotate(-10deg);
        }
        .status-paid {
            color: #ff5a3c;
        }
        .status-expired {
            color: #b9b9b9;
        }
        .pay-method-title,
        .order-title {
            margin-bottom: 15px;
            color: #333;
            font-size: 14px;
            font-weight: 700;
        }
        .pay-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .wechat-icon {
            color: #09bb07;
            font-weight: 700;
        }
        .pay-name {
            color: #333;
            font-size: 15px;
        }
        .check-icon {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #f75a4b;
            box-shadow: 0 0 0 4px rgba(247,90,75,.12);
        }
        .btn-pay-now {
            display: block;
            width: 100%;
            margin-top: 16px;
            padding: 13px 0;
            border: none;
            border-radius: 25px;
            background: linear-gradient(90deg, #ff3100 0%, #f2270c 100%);
            box-shadow: 0 4px 12px rgba(242,39,12,.28);
            color: #fff;
            font-size: 17px;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
        }
        .btn-pay-now.btn-disabled {
            background: #ccc;
            box-shadow: none;
            pointer-events: none;
        }
        .prod-row {
            display: flex;
            align-items: center;
        }
        .multi-prod-row {
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px dashed #f1f1f1;
        }
        .multi-prod-row:last-child {
            margin-bottom: 0;
            border-bottom: none;
            padding-bottom: 0;
        }
        .prod-img {
            width: 78px;
            height: 78px;
            margin-right: 14px;
            border: 1px solid #f0f0f0;
            border-radius: 8px;
            background: #fafafa;
            object-fit: cover;
            flex-shrink: 0;
        }
        .small-prod-img {
            width: 58px;
            height: 58px;
        }
        .prod-info {
            flex: 1;
            min-width: 0;
        }
        .prod-name {
            overflow: hidden;
            color: #333;
            font-size: 14px;
            line-height: 1.45;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .one-line {
            -webkit-line-clamp: 1;
        }
        .prod-price {
            color: #f2270c;
            font-weight: 700;
        }
        .prod-qty,
        .multi-summary,
        .order-empty {
            color: #999;
            font-size: 12px;
        }
        .multi-summary {
            margin-top: 8px;
            text-align: right;
        }
        .order-empty {
            padding: 12px 0;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="cashier-jd">
    <div class="header-bg">
        <div class="user-interaction">
            <img th:src="${userAvatar ?: 'https://img.yzcdn.cn/vant/cat.jpeg'}" class="u-avatar" alt="avatar">
            <div class="bubble">
                <span th:text="${shareTitle ?: '我在京东挑了件好东西，请你帮我付款'}">我在京东挑了件好东西，请你帮我付款</span>
                <img
                    src="https://img14.360buyimg.com/imagetools/jfs/t1/138657/16/22818/5048/61d563a3E090967a5/4e09525287310023.png"
                    class="mascot"
                    alt="jd"
                >
            </div>
        </div>
    </div>

    <div class="jd-card amount-card">
        <div class="amount-row">
            <span class="amount-label">代付金额</span>
            <span class="receiver-info">收货人：<span th:text="${userNick ?: '京东用户'}">京东用户</span></span>
        </div>
        <div class="amount-bottom">
            <div
                class="price-large"
                th:classappend="${isPaid} ? ' paid' : (${remainingSeconds <= 0} ? ' expired' : '')"
                th:text="${order.money}"
            >0.00</div>
            <div class="timer-row" th:classappend="${isPaid or remainingSeconds <= 0} ? ' muted' : ''">
                <span>剩余支付时间</span>
                <div class="timer-box" th:if="${!isPaid and remainingSeconds > 0}">
                    <span class="t-num">00</span> :
                    <span class="t-num" id="m">00</span> :
                    <span class="t-num" id="s">00</span>
                </div>
                <span th:if="${isPaid}">支付已完成</span>
                <span th:if="${!isPaid and remainingSeconds <= 0}">订单已过期</span>
            </div>
        </div>

        <div th:if="${isPaid}" class="status-badge status-paid">已支付</div>
        <div th:if="${!isPaid and remainingSeconds <= 0}" class="status-badge status-expired">已过期</div>
    </div>

    <div class="jd-card">
        <div class="pay-method-title">支付方式</div>
        <div class="pay-row">
            <div class="pay-left">
                <span class="wechat-icon">微信</span>
                <span class="pay-name">微信支付</span>
            </div>
            <span class="check-icon"></span>
        </div>

        <button th:if="${isPaid}" class="btn-pay-now btn-disabled" type="button">支付已完成</button>
        <button th:if="${!isPaid and remainingSeconds <= 0}" class="btn-pay-now btn-disabled" type="button">订单已过期</button>
        <button th:if="${!isPaid and remainingSeconds > 0}" id="friendPayBtn" class="btn-pay-now" type="button">立即支付</button>
    </div>

    <div class="jd-card">
        <div class="order-title">代付订单信息</div>

        <th:block th:if="${!#lists.isEmpty(orderItems)}">
            <th:block th:if="${#lists.size(orderItems) > 1}">
                <div th:each="item : ${orderItems}" class="prod-row multi-prod-row">
                    <img
                        th:src="${item['image'] != null ? (#strings.startsWith(item['image'], 'http') ? item['image'] : '/api' + item['image']) : 'https://img.yzcdn.cn/vant/cat.jpeg'}"
                        class="prod-img small-prod-img"
                        alt="product"
                    >
                    <div class="prod-info">
                        <div class="prod-name one-line" th:text="${item['name']}">商品名称</div>
                        <div class="prod-price-row">
                            <span class="prod-price">¥<span th:text="${item['price']}">0.00</span></span>
                            <span class="prod-qty">x<span th:text="${item['quantity'] != null ? item['quantity'] : 1}">1</span></span>
                        </div>
                    </div>
                </div>
                <div class="multi-summary">
                    共 <span th:text="${#lists.size(orderItems)}">1</span> 件商品，合计 ¥<span th:text="${order.money}">0.00</span>
                </div>
            </th:block>

            <th:block th:if="${#lists.size(orderItems) == 1}">
                <div class="prod-row">
                    <img
                        th:src="${orderItems[0]['image'] != null ? (#strings.startsWith(orderItems[0]['image'], 'http') ? orderItems[0]['image'] : '/api' + orderItems[0]['image']) : 'https://img.yzcdn.cn/vant/cat.jpeg'}"
                        class="prod-img"
                        alt="product"
                    >
                    <div class="prod-info">
                        <div class="prod-name" th:text="${order.orderName}">商品名称</div>
                        <div class="prod-price-row">
                            <span class="prod-price">¥<span th:text="${order.money}">0.00</span></span>
                            <span class="prod-qty">数量 x1</span>
                        </div>
                    </div>
                </div>
            </th:block>
        </th:block>

        <th:block th:if="${#lists.isEmpty(orderItems)}">
            <div class="order-empty">暂无订单商品信息</div>
        </th:block>
    </div>
</div>

<script src="https://res2.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
<script th:inline="javascript">
    const outTradeNo = [[${order.outTradeNo}]];
    const expireTimestamp = [[${expireTimestamp}]];
    let paySubmitting = false;
    let timerId = null;

    function getRemainSeconds() {
        if (!expireTimestamp) {
            return 0;
        }
        const diff = expireTimestamp - Date.now();
        if (diff <= 0) {
            return 0;
        }
        return Math.ceil(diff / 1000);
    }

    function isWechat() {
        return /micromessenger/i.test(window.navigator.userAgent);
    }

    function getPayBtn() {
        return document.getElementById('friendPayBtn');
    }

    function setPayBtnState(disabled, text) {
        const btn = getPayBtn();
        if (!btn) return;

        btn.disabled = disabled;

        if (disabled) {
            btn.classList.add('btn-disabled');
        } else {
            btn.classList.remove('btn-disabled');
        }

        if (text) {
            btn.innerText = text;
        }
    }

    function jumpToJingdong() {
        window.location.href = 'https://www.jd.com';
    }

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function queryOrderPaid() {
        const resp = await fetch('/api/biz/order/query?outTradeNo=' + encodeURIComponent(outTradeNo), {
            method: 'GET',
            credentials: 'same-origin'
        });

        const res = await resp.json();

        if (!res || res.code !== 200 || !res.data) {
            return false;
        }

        const order = res.data;
        return order.status === '1' || order.status === 1;
    }

    function updateTimer() {
        const mEl = document.getElementById('m');
        const sEl = document.getElementById('s');
        const remain = getRemainSeconds();

        if (remain <= 0) {
            if (mEl) mEl.innerText = '00';
            if (sEl) sEl.innerText = '00';
            setPayBtnState(true, '订单已过期');
            if (timerId) {
                clearInterval(timerId);
                timerId = null;
            }
            return;
        }

        const m = Math.floor(remain / 60);
        const s = remain % 60;

        if (mEl) {
            mEl.innerText = m < 10 ? '0' + m : '' + m;
        }
        if (sEl) {
            sEl.innerText = s < 10 ? '0' + s : '' + s;
        }

        if (!paySubmitting) {
            setPayBtnState(false, '立即支付');
        }
    }

    function invokeJsapiPay(payParams) {
        async function handlePaySuccess() {
            try {
                setPayBtnState(true, '正在确认支付结果...');

                for (let i = 0; i < 6; i++) {
                    const paid = await queryOrderPaid();
                    if (paid) {
                        jumpToJingdong();
                        return;
                    }
                    await sleep(1500);
                }

                window.location.reload();
            } catch (e) {
                console.error('查单失败', e);
                window.location.reload();
            }
        }

        function onBridgeReady() {
            WeixinJSBridge.invoke(
                'getBrandWCPayRequest',
                {
                    appId: payParams.appId,
                    timeStamp: payParams.timeStamp,
                    nonceStr: payParams.nonceStr,
                    package: payParams.packageValue || payParams.package,
                    signType: payParams.signType || 'MD5',
                    paySign: payParams.paySign
                },
                async function (res) {
                    paySubmitting = false;

                    if (res.err_msg === 'get_brand_wcpay_request:ok') {
                        await handlePaySuccess();
                        return;
                    }

                    if (getRemainSeconds() > 0) {
                        setPayBtnState(false, '立即支付');
                    } else {
                        setPayBtnState(true, '订单已过期');
                    }

                    if (res.err_msg !== 'get_brand_wcpay_request:cancel') {
                        alert('支付未完成：' + res.err_msg);
                    }
                }
            );
        }

        if (typeof WeixinJSBridge === 'undefined') {
            document.addEventListener('WeixinJSBridgeReady', onBridgeReady, false);
        } else {
            onBridgeReady();
        }
    }

    async function submitFriendPay() {
        if (paySubmitting) {
            return;
        }
        if (getRemainSeconds() <= 0) {
            setPayBtnState(true, '订单已过期');
            return;
        }

        if (!isWechat()) {
            alert('请在微信内打开页面完成支付');
            return;
        }

        paySubmitting = true;
        setPayBtnState(true, '正在调起支付...');

        try {
            const resp = await fetch('/api/biz/order/pay', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'same-origin',
                body: JSON.stringify({
                    tradeNo: outTradeNo
                })
            });
            const res = await resp.json();

            if (!res || res.code !== 200 || !res.data || !res.data.payParams) {
                paySubmitting = false;

                if (getRemainSeconds() > 0) {
                    setPayBtnState(false, '立即支付');
                } else {
                    setPayBtnState(true, '订单已过期');
                }
                alert((res && res.msg) || '发起支付失败');
                return;
            }

            invokeJsapiPay(res.data.payParams);
        } catch (e) {
            paySubmitting = false;
            if (getRemainSeconds() > 0) {
                setPayBtnState(false, '立即支付');
            } else {
                setPayBtnState(true, '订单已过期');
            }
            alert('支付请求异常');
            console.error(e);
        }
    }

    const payBtn = getPayBtn();
    if (payBtn) {
        payBtn.addEventListener('click', submitFriendPay);
    }

    updateTimer();
    timerId = setInterval(updateTimer, 1000);

    async function initWechatShare() {
        if (!isWechat()) {
            return;
        }

        try {
            const signUrl = window.location.href.split('#')[0];
            const apiUrl = '/api/biz/wechat/jsapi/signature?url=' + encodeURIComponent(signUrl);

            const resp = await fetch(apiUrl, {
                method: 'GET',
                credentials: 'same-origin'
            });
            const res = await resp.json();

            if (!res || res.code !== 200 || !res.data) {
                console.error('获取微信签名失败:', res);
                return;
            }

            const config = res.data;

            wx.config({
                debug: false,
                appId: config.appId,
                timestamp: config.timestamp,
                nonceStr: config.nonceStr,
                signature: config.signature,
                jsApiList: [
                    'updateAppMessageShareData',
                    'onMenuShareAppMessage'
                ]
            });

            wx.ready(function () {
                const shareData = {
                    title: [[${shareTitle}]],
                    desc: [[${shareDesc}]],
                    link: [[${shareUrl}]],
                    imgUrl: [[${shareImage}]]
                };

                if (typeof wx.onMenuShareAppMessage === 'function') {
                    wx.onMenuShareAppMessage(shareData);
                }

                if (typeof wx.updateAppMessageShareData === 'function') {
                    wx.updateAppMessageShareData(shareData);
                }
            });

            wx.error(function (err) {
                console.error('微信 JSSDK 配置失败:', err);
            });
        } catch (e) {
            console.error('初始化微信分享失败', e);
        }
    }

    initWechatShare();
</script>
</body>
</html>
