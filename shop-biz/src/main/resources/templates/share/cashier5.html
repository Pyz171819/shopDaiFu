<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <title>淘宝闪购代付</title>
    <meta name="description" th:content="${shareDesc}">

    <meta property="og:title" th:content="${shareTitle}">
    <meta property="og:description" th:content="${shareDesc}">
    <meta property="og:image" th:content="${shareImage}">
    <meta property="og:url" th:content="${shareUrl}">
    <meta property="og:type" content="website">

    <link rel="canonical" th:href="${shareUrl}">

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            background: #f6f6f6;
            color: #222;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        }
        .cashier-taobao {
            min-height: 100vh;
            padding-bottom: 32px;
            background: linear-gradient(180deg, #ff6b00 0, #ff8a00 180px, #f6f6f6 181px);
        }
        .tb-header {
            padding: 32px 20px 24px;
            color: #fff;
            text-align: center;
        }
        .avatar-box {
            display: block;
            margin-bottom: 10px;
        }
        .u-avatar {
            width: 56px;
            height: 56px;
            border: 2px solid #fff;
            border-radius: 50%;
            background: #fff;
            object-fit: cover;
        }
        .slogan {
            position: relative;
            display: inline-block;
            max-width: 92%;
            padding-bottom: 15px;
            font-size: 15px;
            font-weight: 500;
            line-height: 1.5;
        }
        .slogan::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 140%;
            height: 1px;
            transform: translateX(-50%);
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
        }
        .ticket-wrapper {
            margin: 0 16px;
        }
        .card-top,
        .card-bottom {
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,.03);
        }
        .card-top {
            padding: 34px 20px 30px;
            border-radius: 12px 12px 0 0;
            text-align: center;
        }
        .price-label {
            margin-bottom: 12px;
            color: #333;
            font-size: 42px;
            font-weight: 700;
            line-height: 1;
        }
        .price-symbol {
            margin-right: 2px;
            font-size: 26px;
            font-weight: 500;
        }
        .timer-text {
            color: #999;
            font-size: 13px;
            line-height: 1.7;
        }
        .timer-text.success {
            color: #29c378;
            font-weight: 700;
        }
        .timer-num {
            color: #ff5000;
            font-weight: 700;
        }
        .tear-line {
            height: 12px;
            background: radial-gradient(circle at 6px 6px, #f6f6f6 5px, #fff 6px) repeat-x;
            background-size: 16px 12px;
        }
        .card-bottom {
            padding: 24px 20px 22px;
            border-radius: 0 0 12px 12px;
        }
        .shop-name {
            margin-bottom: 12px;
            color: #999;
            font-size: 13px;
        }
        .prod-row {
            display: flex;
            align-items: flex-start;
        }
        .multi-prod {
            margin-bottom: 15px;
        }
        .multi-prod:last-child {
            margin-bottom: 0;
        }
        .prod-img {
            width: 68px;
            height: 68px;
            margin-right: 14px;
            border-radius: 6px;
            background: #f8f8f8;
            object-fit: cover;
            flex-shrink: 0;
        }
        .prod-info {
            flex: 1;
            min-width: 0;
        }
        .prod-title {
            overflow: hidden;
            color: #333;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .prod-qty {
            margin-top: 6px;
            color: #999;
            font-size: 13px;
        }
        .price-text {
            color: #ff5000;
            font-weight: 700;
        }
        .price-text span {
            margin-left: 5px;
            color: #999;
            font-weight: 400;
        }
        .order-empty {
            color: #999;
            font-size: 13px;
            text-align: center;
        }
        .pay-actions {
            margin: 16px 16px 0;
        }
        .btn-link {
            width: 100%;
            height: 44px;
            border: 1px solid #ff5000;
            border-radius: 22px;
            background: #fff;
            color: #ff5000;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-link.btn-disabled {
            border-color: #d6d6d6;
            background: #efefef;
            color: #a8a8a8;
            pointer-events: none;
        }
        .footer-note {
            margin: 16px 20px 0;
            color: #aaa;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="cashier-taobao">
    <div class="tb-header">
        <div class="avatar-box">
            <img th:src="${userAvatar ?: 'https://img.yzcdn.cn/vant/cat.jpeg'}" class="u-avatar" alt="avatar">
        </div>
        <div class="slogan" th:text="${shareDesc ?: '请你帮我付个款吧，拜托啦~'}">请你帮我付个款吧，拜托啦~</div>
    </div>

    <div class="ticket-wrapper">
        <div class="card-top">
            <div class="price-label"><span class="price-symbol">¥</span><span th:text="${order.money}">0.00</span></div>

            <div th:if="${isPaid}" class="timer-text success">支付已完成</div>
            <div th:if="${!isPaid and remainingSeconds <= 0}" class="timer-text">订单已超时关闭</div>
            <div th:if="${!isPaid and remainingSeconds > 0}" class="timer-text">
                请在 <span class="timer-num" id="m">00</span> : <span class="timer-num" id="s">00</span> 内完成支付，超时后订单将自动取消
            </div>
        </div>

        <div class="tear-line"></div>

        <div class="card-bottom">
            <div
                class="shop-name"
                th:text="${!#lists.isEmpty(orderItems) and orderItems[0]['shopName'] != null ? orderItems[0]['shopName'] : (order.orderName ?: '淘宝闪购店铺')}"
            >淘宝闪购店铺</div>

            <th:block th:if="${!#lists.isEmpty(orderItems)}">
                <th:block th:if="${#lists.size(orderItems) > 1}">
                    <div th:each="item : ${orderItems}" class="prod-row multi-prod">
                        <img
                            th:src="${item['image'] != null ? (#strings.startsWith(item['image'], 'http') ? item['image'] : '/api' + item['image']) : 'https://img.yzcdn.cn/vant/cat.jpeg'}"
                            class="prod-img"
                            alt="product"
                        >
                        <div class="prod-info">
                            <div class="prod-title" th:text="${item['name']}">商品名称</div>
                            <div class="prod-qty price-text">
                                ¥<span th:text="${item['price']}">0.00</span>
                                <span>x<span th:text="${item['quantity'] != null ? item['quantity'] : 1}">1</span></span>
                            </div>
                        </div>
                    </div>
                </th:block>

                <th:block th:if="${#lists.size(orderItems) == 1}">
                    <div class="prod-row">
                        <img
                            th:src="${orderItems[0]['image'] != null ? (#strings.startsWith(orderItems[0]['image'], 'http') ? orderItems[0]['image'] : '/api' + orderItems[0]['image']) : 'https://img.yzcdn.cn/vant/cat.jpeg'}"
                            class="prod-img"
                            alt="product"
                        >
                        <div class="prod-info">
                            <div class="prod-title" th:text="${order.orderName}">商品名称</div>
                            <div class="prod-qty">x1</div>
                        </div>
                    </div>
                </th:block>
            </th:block>

            <th:block th:if="${#lists.isEmpty(orderItems)}">
                <div class="order-empty">暂无商品信息</div>
            </th:block>
        </div>
    </div>

    <div class="pay-actions">
        <button th:if="${isPaid}" class="btn-link btn-disabled" type="button">支付已完成</button>
        <button th:if="${!isPaid and remainingSeconds <= 0}" class="btn-link btn-disabled" type="button">订单已过期</button>
        <button th:if="${!isPaid and remainingSeconds > 0}" id="friendPayBtn" class="btn-link" type="button">立即代付</button>
    </div>

    <div class="footer-note">本页面仅用于分享代付请求</div>
</div>

<script src="https://res2.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
<script th:inline="javascript">
    const outTradeNo = [[${order.outTradeNo}]];
    const expireTimestamp = [[${expireTimestamp}]];
    let paySubmitting = false;
    let timerId = null;

    function getRemainSeconds() {
        if (!expireTimestamp) {
            return 0;
        }
        const diff = expireTimestamp - Date.now();
        if (diff <= 0) {
            return 0;
        }
        return Math.ceil(diff / 1000);
    }

    function isWechat() {
        return /micromessenger/i.test(window.navigator.userAgent);
    }

    function getPayBtn() {
        return document.getElementById('friendPayBtn');
    }

    function setPayBtnState(disabled, text) {
        const btn = getPayBtn();
        if (!btn) return;

        btn.disabled = disabled;

        if (disabled) {
            btn.classList.add('btn-disabled');
        } else {
            btn.classList.remove('btn-disabled');
        }

        if (text) {
            btn.innerText = text;
        }
    }

    function jumpToTaobao() {
        window.location.href = 'https://www.taobao.com';
    }

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function queryOrderPaid() {
        const resp = await fetch('/api/biz/order/query?outTradeNo=' + encodeURIComponent(outTradeNo), {
            method: 'GET',
            credentials: 'same-origin'
        });

        const res = await resp.json();

        if (!res || res.code !== 200 || !res.data) {
            return false;
        }

        const order = res.data;
        return order.status === '1' || order.status === 1;
    }

    function updateTimer() {
        const mEl = document.getElementById('m');
        const sEl = document.getElementById('s');
        const remain = getRemainSeconds();

        if (remain <= 0) {
            if (mEl) mEl.innerText = '00';
            if (sEl) sEl.innerText = '00';
            setPayBtnState(true, '订单已过期');
            if (timerId) {
                clearInterval(timerId);
                timerId = null;
            }
            return;
        }

        const m = Math.floor(remain / 60);
        const s = remain % 60;

        if (mEl) {
            mEl.innerText = m < 10 ? '0' + m : '' + m;
        }
        if (sEl) {
            sEl.innerText = s < 10 ? '0' + s : '' + s;
        }

        if (!paySubmitting) {
            setPayBtnState(false, '立即代付');
        }
    }

    function invokeJsapiPay(payParams) {
        async function handlePaySuccess() {
            try {
                setPayBtnState(true, '正在确认支付结果...');

                for (let i = 0; i < 6; i++) {
                    const paid = await queryOrderPaid();
                    if (paid) {
                        jumpToTaobao();
                        return;
                    }
                    await sleep(1500);
                }

                window.location.reload();
            } catch (e) {
                console.error('查单失败', e);
                window.location.reload();
            }
        }

        function onBridgeReady() {
            WeixinJSBridge.invoke(
                'getBrandWCPayRequest',
                {
                    appId: payParams.appId,
                    timeStamp: payParams.timeStamp,
                    nonceStr: payParams.nonceStr,
                    package: payParams.packageValue || payParams.package,
                    signType: payParams.signType || 'MD5',
                    paySign: payParams.paySign
                },
                async function (res) {
                    paySubmitting = false;

                    if (res.err_msg === 'get_brand_wcpay_request:ok') {
                        await handlePaySuccess();
                        return;
                    }

                    if (getRemainSeconds() > 0) {
                        setPayBtnState(false, '立即代付');
                    } else {
                        setPayBtnState(true, '订单已过期');
                    }

                    if (res.err_msg !== 'get_brand_wcpay_request:cancel') {
                        alert('支付未完成：' + res.err_msg);
                    }
                }
            );
        }

        if (typeof WeixinJSBridge === 'undefined') {
            document.addEventListener('WeixinJSBridgeReady', onBridgeReady, false);
        } else {
            onBridgeReady();
        }
    }

    async function submitFriendPay() {
        if (paySubmitting) {
            return;
        }
        if (getRemainSeconds() <= 0) {
            setPayBtnState(true, '订单已过期');
            return;
        }

        if (!isWechat()) {
            alert('请在微信内打开页面完成支付');
            return;
        }

        paySubmitting = true;
        setPayBtnState(true, '正在调起支付...');

        try {
            const resp = await fetch('/api/biz/order/pay', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'same-origin',
                body: JSON.stringify({
                    tradeNo: outTradeNo
                })
            });
            const res = await resp.json();

            if (!res || res.code !== 200 || !res.data || !res.data.payParams) {
                paySubmitting = false;

                if (getRemainSeconds() > 0) {
                    setPayBtnState(false, '立即代付');
                } else {
                    setPayBtnState(true, '订单已过期');
                }
                alert((res && res.msg) || '发起支付失败');
                return;
            }

            invokeJsapiPay(res.data.payParams);
        } catch (e) {
            paySubmitting = false;
            if (getRemainSeconds() > 0) {
                setPayBtnState(false, '立即代付');
            } else {
                setPayBtnState(true, '订单已过期');
            }
            alert('支付请求异常');
            console.error(e);
        }
    }

    const payBtn = getPayBtn();
    if (payBtn) {
        payBtn.addEventListener('click', submitFriendPay);
    }

    updateTimer();
    timerId = setInterval(updateTimer, 1000);

    async function initWechatShare() {
        if (!isWechat()) {
            return;
        }

        try {
            const signUrl = window.location.href.split('#')[0];
            const apiUrl = '/api/biz/wechat/jsapi/signature?url=' + encodeURIComponent(signUrl);

            const resp = await fetch(apiUrl, {
                method: 'GET',
                credentials: 'same-origin'
            });
            const res = await resp.json();

            if (!res || res.code !== 200 || !res.data) {
                console.error('获取微信签名失败:', res);
                return;
            }

            const config = res.data;

            wx.config({
                debug: false,
                appId: config.appId,
                timestamp: config.timestamp,
                nonceStr: config.nonceStr,
                signature: config.signature,
                jsApiList: [
                    'updateAppMessageShareData',
                    'onMenuShareAppMessage'
                ]
            });

            wx.ready(function () {
                const shareData = {
                    title: [[${shareTitle}]],
                    desc: [[${shareDesc}]],
                    link: [[${shareUrl}]],
                    imgUrl: [[${shareImage}]]
                };

                if (typeof wx.onMenuShareAppMessage === 'function') {
                    wx.onMenuShareAppMessage(shareData);
                }

                if (typeof wx.updateAppMessageShareData === 'function') {
                    wx.updateAppMessageShareData(shareData);
                }
            });

            wx.error(function (err) {
                console.error('微信 JSSDK 配置失败:', err);
            });
        } catch (e) {
            console.error('初始化微信分享失败', e);
        }
    }

    initWechatShare();
</script>
</body>
</html>
