<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <title>拼多多代付</title>
    <meta name="description" th:content="${shareDesc}">

    <meta property="og:title" th:content="${shareTitle}">
    <meta property="og:description" th:content="${shareDesc}">
    <meta property="og:image" th:content="${shareImage}">
    <meta property="og:url" th:content="${shareUrl}">
    <meta property="og:type" content="website">

    <link rel="canonical" th:href="${shareUrl}">

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; background-color: #F4F4F4; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; }
        .cashier-pinduoduo { min-height: 100vh; background-color: #F4F4F4; padding-bottom: 20px; }
        .pdd-header { background-color: #F3554F; padding: 20px 20px 60px 20px; display: flex; align-items: flex-start; }
        .avatar-img { width: 50px; height: 50px; border-radius: 50%; margin-right: 12px; object-fit: cover; border: 1px solid rgba(255,255,255,0.2); flex-shrink: 0; }
        .user-col { display: flex; flex-direction: column; padding-top: 2px; flex: 1; }
        .nick-name { color: #fff; font-size: 16px; font-weight: 500; margin-bottom: 8px; }
        .bubble-msg { background-color: rgba(255,255,255,0.2); color: #fff; font-size: 13px; padding: 6px 12px; border-radius: 4px; position: relative; line-height: 1.4; max-width: 210px; word-wrap: break-word; }
        .bubble-msg::before { content: ''; position: absolute; left: -6px; top: 50%; margin-top: -6px; border-width: 6px 6px 6px 0; border-style: solid; border-color: transparent rgba(255,255,255,0.2) transparent transparent; }
        .main-card { background: #fff; margin: -40px 12px 20px 12px; border-radius: 8px; padding: 30px 20px 0 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); text-align: center; }
        .pay-label { font-size: 15px; color: #333; margin-bottom: 15px; font-weight: 500; }
        .price-wrap { color: #000; font-weight: bold; font-family: Arial, sans-serif; margin-bottom: 25px; display: flex; align-items: baseline; justify-content: center; }
        .symbol { font-size: 24px; margin-right: 4px; }
        .amount { font-size: 42px; letter-spacing: -1px; }
        .timer-wrap { display: flex; justify-content: center; align-items: center; margin-bottom: 20px; font-size: 14px; color: #333; }
        .timer-box { background: #333; color: #fff; padding: 2px 6px; border-radius: 4px; margin: 0 4px; font-weight: bold; }
        .btn-pdd { display: block; width: 100%; background-color: #E02E24; color: #fff; font-size: 17px; font-weight: bold; padding: 12px 0; border-radius: 6px; text-decoration: none; border: none; margin-bottom: 15px; cursor: pointer; }
        .btn-pdd:active { opacity: 0.9; }
        .btn-pdd.btn-disabled { background: #ccc; pointer-events: none; }
        .note-text { color: #9C9C9C; font-size: 12px; margin-bottom: 25px; transform: scale(0.95); }
        .prod-section { border-top: 1px solid #F2F2F2; padding: 20px 0; text-align: left; }
        .prod-item-row { display: flex; align-items: center; margin-bottom: 15px; }
        .prod-item-row:last-child { margin-bottom: 0; }
        .prod-img { width: 60px; height: 60px; border-radius: 4px; object-fit: cover; margin-right: 12px; flex-shrink: 0; background: #f8f8f8; }
        .prod-info { flex: 1; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
        .prod-title { font-size: 14px; color: #151516; margin-bottom: 4px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .prod-spec { font-size: 12px; color: #9C9C9C; margin-bottom: 4px; }
        .prod-price-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #9C9C9C; }
        .price-small { color: #9C9C9C; font-family: Arial, sans-serif; }
        .total-summary { text-align: right; border-top: 1px dashed #eee; margin-top: 15px; padding-top: 10px; font-size: 12px; color: #999; }
        .total-price { color: #E02E24; font-weight: bold; }
    </style>
</head>
<body>
<div class="cashier-pinduoduo">
    <div class="pdd-header">
        <img th:src="${userAvatar}" class="avatar-img" alt="头像">
        <div class="user-col">
            <div class="nick-name" th:text="${userNick}">拼多多用户</div>
            <div class="bubble-msg">帮我付一下这件商品吧，谢谢啦</div>
        </div>
    </div>

    <div class="main-card">
        <div class="pay-label">代付金额</div>

        <div class="price-wrap">
            <span class="symbol">¥</span>
            <span class="amount" th:text="${order.money}">0.00</span>
        </div>

        <div class="timer-wrap" th:if="${!isPaid and remainingSeconds > 0}">
            支付剩余时间
            <span class="timer-box" id="m">00</span> :
            <span class="timer-box" id="s">00</span>
        </div>

        <button th:if="${isPaid}" class="btn-pdd btn-disabled" type="button">来迟了，代付已付款</button>
        <button th:if="${!isPaid and remainingSeconds <= 0}" class="btn-pdd btn-disabled" type="button">订单已过期</button>
        <button th:if="${!isPaid and remainingSeconds > 0}" id="friendPayBtn" class="btn-pdd" type="button">立即支付</button>

        <div class="note-text">如果订单申请退款，已支付金额将原路退还给您</div>

        <div class="prod-section">
            <th:block th:if="${!#lists.isEmpty(orderItems)}">
                <th:block th:if="${#lists.size(orderItems) > 1}">
                    <div th:each="item : ${orderItems}" class="prod-item-row">
                        <img th:src="${#strings.startsWith(item['image'], 'http') ? item['image'] : '/api' + item['image']}" class="prod-img" alt="商品">
                        <div class="prod-info">
                            <div class="prod-title" th:text="${item['name']}">商品名</div>
                            <div class="prod-price-row">
                                <span class="price-small">¥<span th:text="${item['price']}">0.00</span></span>
                                <span>x<span th:text="${item['quantity'] != null ? item['quantity'] : 1}">1</span></span>
                            </div>
                        </div>
                    </div>
                    <div class="total-summary">
                        共 <span th:text="${#lists.size(orderItems)}">1</span> 件商品，合计
                        <span class="total-price">¥<span th:text="${order.money}">0.00</span></span>
                    </div>
                </th:block>

                <th:block th:if="${#lists.size(orderItems) == 1}">
                    <div class="prod-item-row">
                        <img th:src="${#strings.startsWith(orderItems[0]['image'], 'http') ? orderItems[0]['image'] : '/api' + orderItems[0]['image']}" class="prod-img" alt="商品">
                        <div class="prod-info">
                            <div class="prod-title" th:text="${order.orderName}">拼多多商品</div>
                            <div class="prod-spec">默认规格</div>
                            <div class="prod-price-row">
                                <span class="price-small">¥<span th:text="${order.money}">0.00</span></span>
                                <span>x1</span>
                            </div>
                        </div>
                    </div>
                </th:block>
            </th:block>

            <th:block th:if="${#lists.isEmpty(orderItems)}">
                <div class="prod-item-row">
                    <div class="prod-info" style="text-align:center; width:100%; color:#999;">暂无商品信息</div>
                </div>
            </th:block>
        </div>
    </div>
</div>

<script src="https://res2.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
<script th:inline="javascript">
    const outTradeNo = [[${order.outTradeNo}]];
    const expireTimestamp = [[${expireTimestamp}]];
    let paySubmitting = false;
    let timerId = null;

    function getRemainSeconds() {
        if (!expireTimestamp) {
            return 0;
        }
        const diff = expireTimestamp - Date.now();
        if (diff <= 0) {
            return 0;
        }
        return Math.ceil(diff / 1000);
    }

    function isWechat() {
        return /micromessenger/i.test(window.navigator.userAgent);
    }

    function getPayBtn() {
        return document.getElementById('friendPayBtn');
    }

    function setPayBtnState(disabled, text) {
        const btn = getPayBtn();
        if (!btn) return;

        btn.disabled = disabled;

        if (disabled) {
            btn.classList.add('btn-disabled');
        } else {
            btn.classList.remove('btn-disabled');
        }

        if (text) {
            btn.innerText = text;
        }
    }

    function jumpToPinduoduo() {
        window.location.href = 'https://www.pinduoduo.com';
    }

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function queryOrderPaid() {
        const resp = await fetch('/api/biz/order/query?outTradeNo=' + encodeURIComponent(outTradeNo), {
            method: 'GET',
            credentials: 'same-origin'
        });

        const res = await resp.json();

        if (!res || res.code !== 200 || !res.data) {
            return false;
        }

        const order = res.data;
        return order.status === '1' || order.status === 1;
    }

    function updateTimer() {
        const mEl = document.getElementById('m');
        const sEl = document.getElementById('s');
        const remain = getRemainSeconds();

        if (remain <= 0) {
            if (mEl) mEl.innerText = '00';
            if (sEl) sEl.innerText = '00';
            setPayBtnState(true, '订单已过期');
            if (timerId) {
                clearInterval(timerId);
                timerId = null;
            }
            return;
        }

        const m = Math.floor(remain / 60);
        const s = remain % 60;

        if (mEl) {
            mEl.innerText = m < 10 ? '0' + m : '' + m;
        }
        if (sEl) {
            sEl.innerText = s < 10 ? '0' + s : '' + s;
        }

        if (!paySubmitting) {
            setPayBtnState(false, '立即支付');
        }
    }

    function invokeJsapiPay(payParams) {
        async function handlePaySuccess() {
            try {
                setPayBtnState(true, '正在确认支付结果...');

                for (let i = 0; i < 6; i++) {
                    const paid = await queryOrderPaid();
                    if (paid) {
                        jumpToPinduoduo();
                        return;
                    }
                    await sleep(1500);
                }

                window.location.reload();
            } catch (e) {
                console.error('查单失败', e);
                window.location.reload();
            }
        }

        function onBridgeReady() {
            WeixinJSBridge.invoke(
                'getBrandWCPayRequest',
                {
                    appId: payParams.appId,
                    timeStamp: payParams.timeStamp,
                    nonceStr: payParams.nonceStr,
                    package: payParams.packageValue || payParams.package,
                    signType: payParams.signType || 'MD5',
                    paySign: payParams.paySign
                },
                async function (res) {
                    paySubmitting = false;

                    if (res.err_msg === 'get_brand_wcpay_request:ok') {
                        await handlePaySuccess();
                        return;
                    }

                    if (getRemainSeconds() > 0) {
                        setPayBtnState(false, '立即支付');
                    } else {
                        setPayBtnState(true, '订单已过期');
                    }

                    if (res.err_msg !== 'get_brand_wcpay_request:cancel') {
                        alert('支付未完成：' + res.err_msg);
                    }
                }
            );
        }

        if (typeof WeixinJSBridge === 'undefined') {
            document.addEventListener('WeixinJSBridgeReady', onBridgeReady, false);
        } else {
            onBridgeReady();
        }
    }

    async function submitFriendPay() {
        if (paySubmitting) {
            return;
        }
        if (getRemainSeconds() <= 0) {
            setPayBtnState(true, '订单已过期');
            return;
        }

        if (!isWechat()) {
            alert('请在微信内打开页面完成支付');
            return;
        }

        paySubmitting = true;
        setPayBtnState(true, '正在调起支付...');

        try {
            const resp = await fetch('/api/biz/order/pay', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'same-origin',
                body: JSON.stringify({
                    tradeNo: outTradeNo
                })
            });
            const res = await resp.json();

            if (!res || res.code !== 200 || !res.data || !res.data.payParams) {
                paySubmitting = false;

                if (getRemainSeconds() > 0) {
                    setPayBtnState(false, '立即支付');
                } else {
                    setPayBtnState(true, '订单已过期');
                }
                alert((res && res.msg) || '发起支付失败');
                return;
            }

            invokeJsapiPay(res.data.payParams);
        } catch (e) {
            paySubmitting = false;
            if (getRemainSeconds() > 0) {
                setPayBtnState(false, '立即支付');
            } else {
                setPayBtnState(true, '订单已过期');
            }
            alert('支付请求异常');
            console.error(e);
        }
    }

    const payBtn = getPayBtn();
    if (payBtn) {
        payBtn.addEventListener('click', submitFriendPay);
    }

    updateTimer();
    timerId = setInterval(updateTimer, 1000);

    async function initWechatShare() {
        if (!isWechat()) {
            return;
        }

        try {
            const signUrl = window.location.href.split('#')[0];
            const apiUrl = '/api/biz/wechat/jsapi/signature?url=' + encodeURIComponent(signUrl);

            const resp = await fetch(apiUrl, {
                method: 'GET',
                credentials: 'same-origin'
            });
            const res = await resp.json();

            if (!res || res.code !== 200 || !res.data) {
                console.error('获取微信签名失败:', res);
                return;
            }

            const config = res.data;

            wx.config({
                debug: false,
                appId: config.appId,
                timestamp: config.timestamp,
                nonceStr: config.nonceStr,
                signature: config.signature,
                jsApiList: [
                    'updateAppMessageShareData',
                    'onMenuShareAppMessage'
                ]
            });

            wx.ready(function () {
                const shareData = {
                    title: [[${shareTitle}]],
                    desc: [[${shareDesc}]],
                    link: [[${shareUrl}]],
                    imgUrl: [[${shareImage}]]
                };

                if (typeof wx.onMenuShareAppMessage === 'function') {
                    wx.onMenuShareAppMessage(shareData);
                }

                if (typeof wx.updateAppMessageShareData === 'function') {
                    wx.updateAppMessageShareData(shareData);
                }
            });

            wx.error(function (err) {
                console.error('微信 JSSDK 配置失败:', err);
            });
        } catch (e) {
            console.error('初始化微信分享失败:', e);
        }
    }

    initWechatShare();
</script>
</body>
</html>
